version: 1
monitor:
  defaultProfile: publication
  concurrency: 4
  timeoutMs: 15000
  retries: 1
  maxBytes: 52428800
  failOn:
    - inaccessible
    - invalid-input
profiles:
  publication:
    expectedContentTypes:
      - application/pdf
    validatePdfSignature: true
    maxBytes: 52428800
providers: {}
