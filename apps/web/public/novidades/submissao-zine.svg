<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de submissao de uma zine</title>
  <desc id="desc">Uma zine enviada passa por revisao antes de entrar no acervo publico.</desc>
  <rect width="1200" height="675" fill="#f6f1e8"/>
  <text x="72" y="88" fill="#171717" font-family="Arial,sans-serif" font-size="34" font-weight="700">Da submissao ao acervo</text>
  <text x="72" y="125" fill="#555" font-family="Arial,sans-serif" font-size="20">Enviar uma zine inicia uma conversa de revisao, nao uma publicacao automatica.</text>
  <g transform="translate(90 230)">
    <rect width="250" height="190" rx="10" fill="#fff" stroke="#171717" stroke-width="5"/>
    <path d="M38 55h174M38 92h130M38 129h160" stroke="#9d6b4f" stroke-width="13" stroke-linecap="round"/>
    <text x="38" y="165" fill="#171717" font-family="Arial,sans-serif" font-size="23" font-weight="700">Envio</text>
  </g>
  <path d="M365 325h105" stroke="#171717" stroke-width="6"/><path d="m455 305 30 20-30 20" fill="none" stroke="#171717" stroke-width="6"/>
  <g transform="translate(520 230)">
    <rect width="250" height="190" rx="10" fill="#d6e4d4" stroke="#171717" stroke-width="5"/>
    <circle cx="65" cy="82" r="30" fill="#171717"/><path d="M65 65v35M48 82h34" stroke="#fff" stroke-width="7"/>
    <path d="M115 70h95M115 105h75" stroke="#171717" stroke-width="11" stroke-linecap="round"/>
    <text x="38" y="165" fill="#171717" font-family="Arial,sans-serif" font-size="23" font-weight="700">Revisao</text>
  </g>
  <path d="M795 325h105" stroke="#171717" stroke-width="6"/><path d="m885 305 30 20-30 20" fill="none" stroke="#171717" stroke-width="6"/>
  <g transform="translate(950 230)">
    <rect width="180" height="190" rx="10" fill="#171717"/>
    <path d="M32 55h116M32 92h90M32 129h108" stroke="#d6e4d4" stroke-width="13" stroke-linecap="round"/>
    <text x="32" y="165" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Acervo</text>
  </g>
  <text x="72" y="575" fill="#555" font-family="Arial,sans-serif" font-size="18">A equipe confere as informações antes de tornar uma publicação pública.</text>
</svg>
