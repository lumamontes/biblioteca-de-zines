name: Monitor published resources

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: git clone --depth 1 https://github.com/lumamontes/external-resources-monitoring-cli.git .monitor-cli
      - run: npm ci
        working-directory: .monitor-cli
      - run: npm run build
        working-directory: .monitor-cli
      - name: Export published resources from Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node apps/web/scripts/export-monitor-resources.mjs monitor-resources.json
      - name: Check published resources
        id: check
        continue-on-error: true
        run: |
          node .monitor-cli/dist/cli.js \
            --input monitor-resources.json \
            --config monitor/config.yml \
            --output resource-report.json \
            --markdown-output resource-report.md
      - name: Update known failures
        if: always() && steps.check.outcome != 'cancelled'
        run: |
          node apps/web/scripts/export-known-failures.mjs \
            monitor-resources.json \
            resource-report.json \
            apps/web/monitor/known-failures.json
      - name: Open known failures pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-known-source-failures
          delete-branch: true
          draft: true
          title: "chore: update known source failures"
          commit-message: "chore: update known source failures"
          body: |
            Automated weekly update from the published resource monitor.
          add-paths: apps/web/monitor/known-failures.json
      - name: Upload monitor reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-resource-monitor-report
          path: |
            resource-report.json
            resource-report.md
          if-no-files-found: warn
      - name: Apply monitor exit status
        if: steps.check.outcome == 'failure'
        run: exit 1
